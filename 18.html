<!DOCTYPE html>
<html>
    <head>
        <title>Formulario para factura</title>
    </head>
    <body>
        <h1>Formulario para factura</h1>
        <fieldset>
            <legend>Datos de la factura</legend>
        <form action="18.php" method="post">
            <label for="nombre">Nombre del cliente:</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="producto">Producto:</label><br>
            <input type="text" id="producto" name="producto"><br><br>

            <label for="cantidad">Cantidad:</label><br>
            <input type="number" id="cantidad" name="cantidad"><br><br>

            <label for="precio">Precio unitario:</label><br>
            <input type="number" id="precio" name="precio" step="0.01"><br><br>

            <input type="submit" value="Enviar">
        </form>
        </fieldset>
</html>
